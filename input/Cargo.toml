[package]
name = "ionconnect-input"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
ionconnect-protocol = { version = "0.1.0", path = "../protocol" }
ionconnect-shared = { version = "0.1.0", path = "../shared" }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt", "macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1.44"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
ashpd = { version = "0.13.12", default-features = false, features = ["tokio", "remote_desktop", "screencast", "input_capture"] }
x11rb = { version = "0.13", features = ["xtest", "xinput", "xkb"] }
reis = { version = "0.7.0", features = ["tokio"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
# `#[implement]` (sonda de arrastre) expande a rutas `::windows_core::…`.
windows-core = "0.60"
windows = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    # Sonda de arrastre de archivos (`win32::drag`): OLE drag-and-drop.
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
] }
